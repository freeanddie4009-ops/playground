<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="배곧라라초 친구들의 AI 웹앱 놀이터 - Reading, Art, Sport, 라라 RAS">
<meta name="theme-color" content="#5ac6fe">
<title>2026 Lara AI 플레이그라운드</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nanum+Gothic:wght@400;700;800&family=Gamja+Flower&family=Dongle:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  /* 키트 색상: 흰 바탕 + 다크 네이비 글씨 + 영역별 파스텔(핑크·노랑·연두·보라) */
  --navy: #0B1D49;
  --text: #17264B;
  --muted: #5c6880;
  --border: #DEE6F4;
  --paper: #ffffff;
  --soft-bg: #F6F8FC;
  --link: #3064C4;
  --ok: #158a52;
  --bad: #c43d3d;
  --sky: #5ac6fe;
  --radius: 24px;
  --shadow: 0 10px 28px rgba(22,44,86,.12);
  --font: "Nunito", "Nanum Gothic", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--text); background: var(--paper); line-height: 1.55; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 4px solid #218dec; outline-offset: 3px; }
h1, h2, h3 { color: var(--navy); line-height: 1.25; text-wrap: balance; }
.shell { max-width: 1480px; margin: 0 auto; padding: 0 20px; }
.ico { width: 18px; height: 18px; flex: none; }

/* ---------- 헤더 ---------- */
.topbar { display: flex; align-items: center; gap: 18px; min-height: 90px; flex-wrap: wrap; }
.brand { width: 230px; flex: 0 0 230px; }
.topnav { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.navitem { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: transparent; padding: 11px 16px; font-weight: 800; color: var(--navy); white-space: nowrap; min-height: 44px; }
.navitem:hover, .navitem.active { background: #EAF0FF; color: var(--link); }
.teacher-link { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #A8B7D2; border-radius: 13px; padding: 10px 17px; font-weight: 800; white-space: nowrap; background: #fff; min-height: 44px; }
.teacher-link:hover { background: #F0EDFF; }
body.admin .teacher-link { background: #7C55D6; border-color: #7C55D6; color: #fff; }
.music-btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #A8B7D2; border-radius: 13px; padding: 10px 15px; font-weight: 800; white-space: nowrap; background: #fff; color: var(--navy); min-height: 44px; }
.music-btn:hover { background: #FFF0F5; }
.music-btn[aria-pressed="true"] { background: #FFE5ED; border-color: #F04780; color: #B3145A; }
.music-btn[aria-pressed="true"] .ico { animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px) rotate(-8deg); } }

/* ---------- 메인 히어로 ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; isolation: isolate;
  height: clamp(540px, calc((100vw - 40px) * .5628), 760px);
  background: var(--sky) url("assets/hero.webp") center bottom / cover no-repeat; }
.hero::after { content: ""; position: absolute; inset: 14% 22% 44%; z-index: -1; background: radial-gradient(ellipse, rgba(230,250,255,.55), transparent 72%); pointer-events: none; }
.hero-copy { padding-top: clamp(30px, 4.2vw, 64px); text-align: center; }
.title-wrap { position: relative; display: inline-block; padding: 0 clamp(36px, 5vw, 80px); }
.school-badge { display: inline-block; margin: 0 0 10px; padding: .3em 1.15em; border-radius: 999px; font-family: "Nanum Gothic", sans-serif; font-weight: 800; font-size: clamp(17px, 1.7vw, 25px); letter-spacing: .02em; color: #fff; background: linear-gradient(180deg, #BBA8FF 0%, #957BF3 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 4px 0 #7357DB, 0 9px 16px rgba(115,87,219,.3); text-shadow: 0 1px 2px rgba(80,50,180,.35); }
.deco-rays { position: absolute; left: clamp(0px, 4vw, 60px); top: -8px; width: clamp(34px, 3.6vw, 54px); height: auto; }
.deco-plane { position: absolute; right: clamp(-20px, -1vw, 0px); top: clamp(-4px, .4vw, 10px); width: clamp(44px, 4.6vw, 70px); height: auto; transform: rotate(-6deg); }
@media (prefers-reduced-motion: no-preference) { .deco-plane { animation: fly 3.2s ease-in-out infinite; } }
@keyframes fly { 50% { transform: translate(5px, -6px) rotate(-10deg); } }
.hero-title { margin: 0; color: #071B52; font-family: "Dongle", "Nanum Gothic", sans-serif; font-size: clamp(64px, 7.8vw, 120px); font-weight: 700; letter-spacing: 0; line-height: 1.05; text-shadow: 2px 4px 0 rgba(255,255,255,.8); }
.hero-title .ai { display: inline-block; font-family: "Nunito", sans-serif; font-weight: 900; font-size: .9em; letter-spacing: .01em; line-height: 1; vertical-align: -.1em; margin-right: .04em; text-shadow: none; }
.ai-a, .ai-i { display: inline-block; -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .02em; }
.ai-a { background-image: radial-gradient(ellipse 34% 16% at 38% 20%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%), linear-gradient(180deg, #FFA6C9 0%, #FF5C98 45%, #E8306F 100%); filter: drop-shadow(0 4px 0 #C21F5B) drop-shadow(0 0 1.5px #fff) drop-shadow(0 10px 10px rgba(194,31,91,.25)); }
.ai-i { background-image: radial-gradient(ellipse 60% 14% at 45% 18%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%), linear-gradient(180deg, #E4FCAE 0%, #B2EA6B 45%, #84CF45 100%); filter: drop-shadow(0 4px 0 #62AA2C) drop-shadow(0 0 1.5px #fff) drop-shadow(0 10px 10px rgba(98,170,44,.22)); }
.hero-sub { margin: 12px auto 0; color: #102456; font-size: clamp(15px, 1.5vw, 22px); font-weight: 800; line-height: 1.5; text-shadow: 0 1px 3px #fff, 0 0 10px rgba(255,255,255,.9); }
.button-deck { position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%); width: min(820px, 74%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; gap: clamp(6px, 1.2vw, 16px); }
.door { display: block; border-radius: 30px; transition: transform .2s ease, filter .2s ease; filter: drop-shadow(0 7px 8px rgba(53,96,56,.14)); }
.door img { width: 100%; height: auto; }
.door:hover, .door:focus-visible { transform: translateY(-12px) scale(1.04); filter: drop-shadow(0 18px 14px rgba(58,100,69,.26)) brightness(1.05); }
.door:active { transform: translateY(-3px) scale(.98); }

/* ---------- 영역 목록 ---------- */
.page { padding-top: 18px; padding-bottom: 80px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--link); font-weight: 800; padding: 10px 0; min-height: 44px; }
.section-banner { position: relative; min-height: 190px; display: flex; align-items: center; gap: 28px; background-position: left center; background-size: cover; background-repeat: no-repeat; border-radius: 24px; overflow: hidden; padding: 30px 40px; }
.banner-spacer { width: 175px; flex: none; }
.banner-text { position: relative; z-index: 1; padding-right: 250px; }
.banner-art { position: absolute; right: clamp(16px, 3vw, 48px); bottom: 6px; height: calc(100% - 16px); max-height: 180px; width: auto; pointer-events: none; }
.section-logo { display: none; width: 64px; height: 64px; flex: none; background: rgba(255,255,255,.8); border-radius: 50%; padding: 8px; }
.section-banner h1 { margin: 0 0 6px; font-size: clamp(28px, 3vw, 46px); }
.section-banner h1 small { font-size: .5em; color: var(--text); margin-left: 6px; font-weight: 800; }
.section-banner p { margin: 0; font-family: "Gamja Flower", "Nanum Gothic", sans-serif; font-size: clamp(20px, 2vw, 26px); line-height: 1.35; color: #3f4566; }
.toolbar { display: flex; align-items: center; gap: 10px; margin: 22px 0; flex-wrap: wrap; }
.search { position: relative; flex: 0 1 380px; min-width: 220px; }
.search input { width: 100%; padding: 11px 14px 11px 40px; border: 1px solid #CAD5E8; border-radius: 999px; min-height: 44px; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.app-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 340px)); justify-content: center; gap: 28px; }
.app-card { border: 1px solid var(--border); border-radius: 24px; background: #fff; box-shadow: 0 7px 17px rgba(30,50,94,.07); padding: 22px 22px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: transform .18s ease, box-shadow .18s ease; }
.app-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.thumb { width: 100%; height: 210px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.thumb img.photo { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
.thumb img.icon { width: 115px; height: 115px; }
.app-card h2 { font-size: 22px; margin: 0 0 8px; }
.app-card h2 a:hover { color: var(--c-ink); }
.app-card p { color: var(--muted); margin: 0 0 18px; flex: 1; white-space: pre-line; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: var(--c, #F04780); color: var(--c-on, #fff); font-weight: 900; padding: 12px 26px; border-radius: 12px; box-shadow: 0 4px 0 var(--c-deep, #C92C68); min-height: 46px; }
.primary:hover { filter: brightness(1.05); }
.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--c-deep, #C92C68); }
.secondary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #9DADD0; background: #fff; color: #243B68; border-radius: 12px; padding: 11px 20px; font-weight: 800; min-height: 46px; }
.secondary:hover { background: var(--soft-bg); }
.empty { border: 2px dashed var(--border); border-radius: 22px; padding: 40px 20px; text-align: center; color: var(--muted); background: #fff; }

/* ---------- 상세 ---------- */
.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin: 6px 0 16px; }
.crumb a { color: var(--link); font-weight: 800; }
.detail-main { display: grid; grid-template-columns: minmax(180px, 320px) 1fr; gap: 28px; align-items: center; border: 1px solid #DEE6F3; border-radius: 22px; padding: 28px; background: linear-gradient(120deg, #fff, #F8FBFF); }
.detail-thumb { aspect-ratio: 16 / 11; border-radius: 18px; background: var(--c-soft); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.detail-thumb img.photo { width: 100%; height: 100%; object-fit: cover; }
.detail-thumb img.icon { width: 58%; height: auto; }
.detail-main h1 { margin: 0 0 6px; font-size: clamp(26px, 3vw, 36px); }
.detail-main p { color: #4c5a74; margin: 8px 0 0; white-space: pre-line; }
.detail-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.detail-lower { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; margin-top: 20px; }
.panel { padding: 24px 26px; border: 1px solid #DDE5F1; border-radius: 22px; background: #fff; }
.panel > h2 { margin: 0 0 16px; font-size: 21px; display: flex; align-items: center; gap: 9px; }
.panel > h2 .hic { width: 34px; height: 34px; border-radius: 10px; background: var(--c-soft, #EEF2FB); color: var(--c-ink, var(--navy)); display: inline-flex; align-items: center; justify-content: center; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; }
.steps li { display: flex; gap: 11px; align-items: flex-start; }
.steps .no { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c-soft); color: var(--c-ink); font-weight: 900; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.res-row { display: flex; align-items: center; gap: 12px; padding: 12px 6px; border-bottom: 1px solid #E5EAF3; flex-wrap: wrap; }
.res-row:last-child { border-bottom: 0; }
.res-row .ficon { width: 38px; height: 38px; border-radius: 10px; background: #FFEDEF; color: #d6455d; display: flex; align-items: center; justify-content: center; flex: none; }
.res-row .ficon.lnk { background: #E8EFFB; color: var(--link); }
.res-row .rinfo { flex: 1; min-width: 160px; }
.res-row .rname { font-weight: 800; }
.res-row .rmeta { font-size: 13px; color: var(--muted); word-break: break-all; }
.res-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: #E8EFFB; color: #1f3f86; border-radius: 10px; padding: 9px 14px; font-weight: 800; min-height: 42px; }
.res-btn:hover { background: #dbe6fa; }
.muted { color: var(--muted); }

/* ---------- 공지·자료 ---------- */
.page-title { font-size: clamp(26px, 3vw, 36px); margin: 8px 0 18px; }
.notice { border: 1px solid var(--border); border-radius: 18px; background: #fff; margin-bottom: 12px; }
.notice summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; font-weight: 800; color: var(--navy); min-height: 56px; }
.notice summary::-webkit-details-marker { display: none; }
.notice .pin { background: #FFE5ED; color: #c2185b; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.notice .ndate { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 14px; }
.notice .nbody { padding: 0 20px 18px; white-space: pre-line; color: #3d4866; }
.area-tag { display: inline-block; border-radius: 999px; padding: 2px 11px; font-size: 13px; font-weight: 800; background: var(--c-soft); color: var(--c-ink); }

/* ---------- 교사 페이지 ---------- */
.teacher-layout { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
.side { flex: 1 1 210px; max-width: 240px; border: 1px solid var(--border); border-radius: 20px; padding: 12px; background: var(--soft-bg); display: flex; flex-direction: column; gap: 4px; }
.side a { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-radius: 12px; font-weight: 800; color: #38456C; min-height: 46px; }
.side a:hover { background: #fff; }
.side a.on { background: #fff; color: var(--link); box-shadow: 0 2px 8px rgba(30,50,94,.08); }
.t-main { flex: 999 1 560px; min-width: 0; }
.t-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.t-head h1 { margin: 0; font-size: 28px; }
.t-head p { margin: 2px 0 0; color: var(--muted); }
.btn-add { --c: #F04780; --c-deep: #C92C68; --c-on: #fff; }
.table-box { overflow-x: auto; border: 1px solid var(--border); border-radius: 18px; background: #fff; }
.teacher-table { width: 100%; border-collapse: collapse; min-width: 640px; }
.teacher-table th, .teacher-table td { padding: 12px 14px; border-bottom: 1px solid #E4E9F3; text-align: left; vertical-align: middle; }
.teacher-table tr:last-child td { border-bottom: 0; }
.teacher-table th { background: #F3F6FB; font-size: 14px; color: #44506e; }
.teacher-table .tthumb { width: 58px; height: 42px; border-radius: 8px; object-fit: cover; background: #F3F6FB; }
.teacher-table .tthumb.icon { object-fit: contain; padding: 3px; }
.state { display: inline-block; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 800; border: 0; min-height: 32px; }
.state.on { background: #DFF6E6; color: #12733f; }
.state.off { background: #EEF0F4; color: #5b6474; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fff; color: #44506e; }
.icon-btn:hover { background: var(--soft-bg); }
.icon-btn.danger { color: var(--bad); border-color: #efcaca; }
.icon-btn.danger.confirm { background: var(--bad); color: #fff; width: auto; padding: 0 12px; font-weight: 800; font-size: 13px; }
.form-card { border: 1px solid var(--border); border-radius: 20px; background: #fff; padding: 22px 24px; margin-bottom: 18px; }
.form-card h2 { margin: 0 0 14px; font-size: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 16px; }
.field label { display: block; font-size: 14px; font-weight: 800; margin-bottom: 5px; color: #44506e; }
.field input[type=text], .field input[type=url], .field input[type=password], .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid #C4CFE3; border-radius: 12px; background: #fff; min-height: 44px; }
.field textarea { resize: vertical; }
.field.full { grid-column: 1 / -1; }
.field .check { display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 44px; }
.field .check input { width: 20px; height: 20px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.msg { font-size: 14px; font-weight: 700; }
.msg.ok { color: var(--ok); }
.msg.bad { color: var(--bad); }
.note { color: #7a5410; background: #FFF8E5; border: 1px solid #F3DE9B; border-radius: 12px; padding: 12px 16px; margin: 0 0 18px; font-size: 14px; }
.inline-upload { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #D5DEEE; }
.inline-upload h3 { margin: 0 0 10px; font-size: 16px; }

.flabel { display: block; font-size: 14px; font-weight: 800; margin-bottom: 5px; color: #44506e; }
.kind-pick { display: flex; gap: 10px; flex-wrap: wrap; }
.kind-pick label { display: flex; align-items: center; gap: 8px; margin: 0; border: 1px solid #C4CFE3; border-radius: 12px; padding: 10px 18px; min-height: 46px; font-weight: 800; color: var(--text); cursor: pointer; background: #fff; }
.kind-pick input { width: 18px; height: 18px; accent-color: var(--c-deep); }
.kind-pick label:has(input:checked) { border-color: var(--c-deep); background: var(--c-soft); }
.kind-tag { display: inline-block; border-radius: 8px; padding: 2px 9px; font-size: 13px; font-weight: 800; background: #EEF2FB; color: #2c4680; }
.kind-tag.html { background: #FFF1DE; color: #8a4b00; }

/* ---------- HTML 웹앱 실행 화면 ---------- */
.player { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #fff; }
.player-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--c-soft); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.player-bar h1 { margin: 0; font-size: 19px; flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-frame { flex: 1; position: relative; background: #fff; }
.player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.player-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); font-weight: 800; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); z-index: 80; max-width: min(560px, calc(100% - 32px)); padding: 12px 20px; border-radius: 14px; background: #17264B; color: #fff; font-weight: 800; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: #a32d2d; }
.setup-list { margin: 8px 0 0; padding-left: 20px; }
.footer { padding: 36px 10px; text-align: center; color: #687896; font-size: 13px; }

/* ---------- 반응형 ---------- */
@media (max-width: 1000px) {
  .topbar { min-height: 78px; }
  .brand { width: 180px; flex-basis: 180px; }
  .navitem { padding: 8px 10px; font-size: 14px; }
  /* 좁은 화면: 놀이터 장면을 가로로 온전히 보여 주고 위쪽은 하늘색으로 이어 붙임 */
  .hero { height: auto; background-size: 100% auto; background-position: center bottom; padding-bottom: clamp(120px, 26vw, 240px); }
  .hero-copy { padding: 44px 14px 0; }
  .button-deck { position: static; transform: none; width: min(720px, 94%); margin: 26px auto 0; }
  .app-grid { grid-template-columns: repeat(2, minmax(0, 340px)); }
  .banner-text { padding-right: 170px; }
  .banner-art { height: 130px; }
  .detail-lower { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .shell { padding: 0 12px; }
  .topbar { padding: 12px 0; gap: 10px; }
  .topnav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
  .music-btn { margin-left: auto; padding: 10px 12px; }
  .music-btn .mlabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .brand { width: 150px; flex-basis: 150px; }
  .teacher-link { padding: 10px 12px; }
  .title-wrap { padding: 0 20px; }
  .deco-rays { left: 0; top: -14px; width: 30px; }
  .deco-plane { right: -6px; top: -16px; width: 40px; }
  .hero-title { font-size: 50px; }
  .hero-sub { font-size: 15px; }

  if (DATA_STATE === "loading" && (h.indexOf("app-") === 0 || h.indexOf("play-") === 0)) return { view: "loading" };

  }
  if (h === "resources" || h === "notices") return { view: h };

}

}

function detailHtml(a) {

/* ===== 저장: 서버(Vercel API)에 목록을 저장 ===== */
function setMsg(id, text, bad) {
  var el = document.getElementById(id);
  if (el) { el.textContent = text; el.className = "msg " + (bad ? "bad" : "ok"); }
}
var toastTimer = null;
function toast(text, bad) {
  var el = document.getElementById("toast");
  el.textContent = text; el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = "toast" + (bad ? " bad" : ""); }, bad ? 5000 : 2600);
}
function errText(e) { return (e && e.message) ? e.message : String(e); }
async function api(path, body) {
  var res = await fetch(path, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  var j = await res.json().catch(function () { return {}; });
  if (res.status === 401 && path !== "/api/login") { setAdmin(false); }
  if (!res.ok) { var e = new Error(j.error || ("요청이 실패했어요 (" + res.status + ")")); e.status = res.status; e.data = j.data; throw e; }
  return j;
}
async function persist(msgId) {
  setMsg(msgId, "저장 중…");
  try {
    var j = await api("/api/save", { rev: DATA.rev, data: DATA });
    DATA = normalize(j.data);
  } catch (e) {
    if (e.status === 409) { DATA = normalize(e.data); e.conflict = true; }
    if (e.status === 401) e.message = "로그인이 끝났어요. 다시 로그인해 주세요.";
    throw e;
  }
}
/* 바꾸기 → 저장. 실패하면 화면 내용을 원래대로 되돌리고, 그사이 올린 파일은 정리 */
async function commit(mutate, msgId, uploaded) {
  var before = JSON.stringify(DATA);
  try { mutate(); await persist(msgId); return true; }
  catch (err) {
    if (uploaded && uploaded.length) cleanupUploads(uploaded);
    if (err.conflict) { ui.editId = null; ui.showForm = false; render(true); toast(err.message, true); return false; }
    DATA = JSON.parse(before);
    if (err.status === 401) { render(true); toast(err.message, true); return false; }
    throw err;
  }
}
function cleanupUploads(urls) { api("/api/delete-files", { urls: urls }).catch(function () {}); }

var blobClient = null;
async function uploadFile(file, msgId, folder) {
  if (file.size > 50 * 1024 * 1024) throw new Error(file.name + " 파일이 50MB보다 커요.");
  if (!blobClient) blobClient = await import("./assets/vendor/blob-client.js");
  var safe = String(file.name || "file").replace(/[\\/:*?"<>|#%&+]+/g, "_").replace(/\s+/g, "_").slice(-120);
  setMsg(msgId, file.name + " 올리는 중…");
  try {
    var r = await blobClient.upload("uploads/" + folder + "/" + safe, file, {
      access: "public", handleUploadUrl: "/api/upload", multipart: file.size > 8 * 1024 * 1024,
      contentType: file.type || undefined,
      onUploadProgress: function (p) { setMsg(msgId, file.name + " 올리는 중… " + Math.round(p.percentage) + "%"); }
    });
    return r.url;
  } catch (e) {
    throw new Error(file.name + " 파일을 올리지 못했어요. " + (/token|401|로그인/i.test(errText(e)) ? "다시 로그인해 보세요." : "파일 형식이나 크기를 확인해 주세요."));
  }
}

async function saveApp(form) {
  var g = function (id) { return document.getElementById(id); };
  var e = ui.editId ? getApp(ui.editId) : null;
  var name = g("a-name").value.trim(), url = safeHttp(g("a-url").value);
  var kindEl = form.querySelector('input[name="a-kind"]:checked');
  var kind = kindEl ? kindEl.value : "link";
  var hfile = g("a-file").files && g("a-file").files[0];
  if (!name) { setMsg("msg-app", "웹앱 이름을 입력해 주세요.", true); return; }
  if (kind === "link" && !url) { setMsg("msg-app", "https:// 로 시작하는 웹앱 링크를 입력해 주세요.", true); return; }
  if (kind === "html" && !hfile && !(e && e.html)) { setMsg("msg-app", "올릴 HTML 파일을 골라 주세요.", true); return; }
  if (kind === "html" && hfile && !/\.html?$/i.test(hfile.name)) { setMsg("msg-app", ".html 또는 .htm 파일만 올릴 수 있어요.", true); return; }
  var btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
  var uploaded = [];
  try {
    var f = g("a-thumb").files && g("a-thumb").files[0];
    var thumb = f ? await uploadFile(f, "msg-app", "thumbs") : null;
    if (thumb) uploaded.push(thumb);
    var htmlUrl = (kind === "html" && hfile) ? await uploadFile(hfile, "msg-app", "apps") : null;
    if (htmlUrl) uploaded.push(htmlUrl);
    var dropThumb = g("a-thumb-del") && g("a-thumb-del").checked;
    var fields = { cat: g("a-cat").value, kind: kind, name: name, url: kind === "link" ? url : "",
      desc: g("a-desc").value.trim(), usage: g("a-usage").value.trim(), icon: g("a-icon").value, hidden: g("a-hidden").checked };
    var editing = !!e;
    var ok = await commit(function () {
      var target = e ? getApp(e.id) : null;
      if (kind === "html") {
        fields.html = htmlUrl || (target ? target.html : null);
        fields.htmlName = htmlUrl ? hfile.name : (target ? target.htmlName : "");
      } else { fields.html = null; fields.htmlName = ""; }
      if (target) {
        Object.keys(fields).forEach(function (k) { target[k] = fields[k]; });
        if (thumb) target.thumb = thumb; else if (dropThumb) target.thumb = null;
      } else {
        fields.id = uid(); fields.thumb = thumb; fields.date = today();
        DATA.apps.push(fields);
      }
    }, "msg-app", uploaded);
    if (ok) { ui.editId = null; ui.showForm = false; ui.formKind = null; render(true); toast(editing ? "웹앱을 수정했어요" : "웹앱을 등록했어요"); }
  } catch (err) {
    if (uploaded.length) cleanupUploads(uploaded);
    btn.disabled = false; setMsg("msg-app", "저장하지 못했어요: " + errText(err), true);
  }
}
async function saveMats(form) {
  var pre = form.getAttribute("data-pre");
  var g = function (s) { return document.getElementById(pre + "-" + s); };
  var msg = pre + "-msg";
  var appId = g("app").value, title = g("title").value.trim(), url = safeHttp(g("url").value);
  var files = g("file").files ? Array.prototype.slice.call(g("file").files) : [];
  if (!appId) { setMsg(msg, "자료를 연결할 웹앱을 골라 주세요.", true); return; }
  if (!files.length && !url) { setMsg(msg, "파일을 고르거나 https:// 링크를 입력해 주세요.", true); return; }
  if (!title && !files.length) { setMsg(msg, "링크 자료의 제목을 입력해 주세요.", true); return; }
  var btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
  var uploaded = [];
  try {
    var added = [];
    for (var i = 0; i < files.length; i++) {
      var u = await uploadFile(files[i], msg, "files");
      uploaded.push(u);
      var t = files.length === 1 && title ? title : (title ? title + " - " : "") + files[i].name.replace(/\.[^.]+$/, "");
      added.push({ id: uid(), app: appId, title: t, type: "file", asset: u, origname: files[i].name, date: today() });
    }
    if (url) added.push({ id: uid(), app: appId, title: title || url, type: "link", url: url, date: today() });
    var ok = await commit(function () { DATA.mats = added.concat(DATA.mats); }, msg, uploaded);
    if (ok) { render(true); toast("수업 자료를 " + added.length + "개 등록했어요"); }
  } catch (err) {
    if (uploaded.length) cleanupUploads(uploaded);
    btn.disabled = false; setMsg(msg, "등록하지 못했어요: " + errText(err), true);
  }
}
async function saveNotice(form) {
  var title = document.getElementById("n-title").value.trim();
  if (!title) { setMsg("msg-notice", "공지 제목을 입력해 주세요.", true); return; }
  var btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
  var item = { id: uid(), title: title, body: document.getElementById("n-body").value.trim(), pinned: document.getElementById("n-pin").checked, date: today() };
  try {
    var ok = await commit(function () { DATA.notices.push(item); }, "msg-notice");
    if (ok) { render(true); toast("공지를 등록했어요"); }
  } catch (err) { btn.disabled = false; setMsg("msg-notice", "등록하지 못했어요: " + errText(err), true); }
}
async function quickSave(mutate, okText) {
  try {
    var ok = await commit(mutate, "msg-list");
    if (ok) { render(true); toast(okText || "저장했어요"); }
  } catch (err) { render(true); toast("저장하지 못했어요: " + errText(err), true); }
}
function onDelete(kind, id) {
  if (ui.pendingDel !== id) { ui.pendingDel = id; render(true); return; }
  ui.pendingDel = null;
  quickSave(function () {
    if (kind === "app") {
      DATA.apps = DATA.apps.filter(function (a) { return a.id !== id; });
      DATA.mats = DATA.mats.filter(function (m) { return m.app !== id; });
    }
    if (kind === "mat") DATA.mats = DATA.mats.filter(function (m) { return m.id !== id; });
    if (kind === "notice") DATA.notices = DATA.notices.filter(function (n) { return n.id !== id; });
  }, "삭제했어요");
}
async function login(form) {
  var pw = document.getElementById("l-pw").value;
  if (!pw) { setMsg("msg-login", "비밀번호를 입력해 주세요.", true); return; }
  var btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
  setMsg("msg-login", "확인 중…");
  try {
    await api("/api/login", { password: pw });
    setAdmin(true); render(); toast("교사 모드가 켜졌어요");
  } catch (err) { btn.disabled = false; setMsg("msg-login", errText(err), true); }
}
async function logout() {
  try { await api("/api/logout"); } catch (e) {}
  setAdmin(false); location.hash = "home"; render(); toast("로그아웃했어요");
}

/* ===== HTML 웹앱 실행: 업로드한 파일을 격리된 틀(sandbox) 안에서 실행 ===== */
var htmlCache = {};
function playHtml(a) {
  return '<div class="player" style="' + catVars(a.cat) + '">' +
    '<div class="player-bar">' +
      '<a class="secondary" href="#app-' + a.id + '">' + svg("back") + " 돌아가기</a>" +
      "<h1>" + esc(a.name) + "</h1>" +
      '<button class="secondary" type="button" data-act="fullscreen">전체 화면</button>' +
    "</div>" +
    '<div class="player-frame" id="player-frame"><div class="player-status" id="player-status" role="status">웹앱을 불러오는 중…</div></div>' +
  "</div>";
}
/* 격리된 틀 안에서는 브라우저 저장 기능이 막혀 있어, 웹앱이 멈추지 않도록 임시 저장소를 넣어 줌 (창을 닫으면 지워짐) */
function withStorageShim(text) {
  var shim = "<scr" + "ipt>(function(){function M(){var d={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}" +
    "['localStorage','sessionStorage'].forEach(function(n){try{window[n].getItem('x')}catch(e){try{Object.defineProperty(window,n,{value:M(),configurable:true})}catch(_){}}})})();</scr" + "ipt>";
  return /<head[^>]*>/i.test(text) ? text.replace(/<head[^>]*>/i, function (m) { return m + shim; }) : shim + text;
}
async function loadPlayer(a) {
  var status = document.getElementById("player-status");
  try {
    var text = htmlCache[a.html];
    if (text == null) {
      var res = await fetch(a.html, { mode: "cors" });
      if (!res.ok) throw new Error(res.status);
      text = await res.text();
      htmlCache[a.html] = text;
    }
    var r = route();
    if (r.view !== "play" || r.app.id !== a.id) return;
    var box = document.getElementById("player-frame");
    var fr = document.createElement("iframe");
    fr.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-pointer-lock allow-popups");
    fr.setAttribute("allow", "fullscreen; autoplay; microphone; camera");
    fr.title = a.name;
    fr.srcdoc = withStorageShim(text);
    box.appendChild(fr);
    if (status) status.remove();
  } catch (err) {
    if (status) status.textContent = "웹앱을 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.";
  }
}

/* ===== 배경음악: 직접 작곡한 짧은 마림바 곡을 브라우저가 연주 (음원 파일·저작권 없음) ===== */
var BGM = { on: false, ctx: null, master: null, timer: null, next: 0, step: 0, noise: null, audible: true };
var BGM_VOL = 0.07;
var SONG = {
  bpm: 112,
  /* 8마디 × 8분음표, MIDI 번호 (0 = 쉼) */
  melody: [76,79,84,79,76,0,79,0, 74,79,83,79,81,79,74,0, 72,76,81,76,79,76,72,76, 77,81,84,81,79,77,76,0,
           79,76,79,84,83,84,79,0, 81,84,81,77,79,81,77,0, 83,81,79,77,76,74,79,0, 84,0,79,0,76,0,72,0],
  roots: [48,43,45,41,48,41,43,48],
  chords: [[60,64,67],[59,62,67],[57,60,64],[57,60,65],[60,64,67],[57,60,65],[59,62,67],[60,64,67]]
};
function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function bgmTone(ctx, out, freq, t, dur, type, vol) {
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
}
function bgmStep(ctx, out, noise, step, t) {
  var e = 60 / SONG.bpm / 2, bar = Math.floor(step / 8) % 8, pos = step % 8;
  var m = SONG.melody[(bar * 8) + pos];
  if (m) {
    bgmTone(ctx, out, mtof(m), t, 0.55, "sine", 0.32);
    bgmTone(ctx, out, mtof(m) * 4, t, 0.09, "sine", 0.05);
  }
  if (pos === 0 || pos === 4) {
    var root = SONG.roots[bar] + (pos === 4 ? 7 : 0);
    bgmTone(ctx, out, mtof(root), t, e * 3.2, "triangle", 0.28);
  }
  if (pos === 0) SONG.chords[bar].forEach(function (c) { bgmTone(ctx, out, mtof(c), t, e * 7.5, "triangle", 0.045); });
  if (pos % 2 === 1 && noise) {
    var src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise; hp.type = "highpass"; hp.frequency.value = 7000;
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(hp); hp.connect(g); g.connect(out); src.start(t); src.stop(t + 0.06);
  }
}
function bgmNoise(ctx) {
  var b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.1), ctx.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function bgmSchedule() {
  var ctx = BGM.ctx, e = 60 / SONG.bpm / 2;
  while (BGM.next < ctx.currentTime + 0.15) {
    bgmStep(ctx, BGM.master, BGM.noise, BGM.step, BGM.next);
    BGM.next += e; BGM.step = (BGM.step + 1) % 64;
  }
}
function bgmFade(to, sec) {
  var g = BGM.master.gain, now = BGM.ctx.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(to, now + sec);
}
function bgmStart() {
  try {
    if (!BGM.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      BGM.ctx = new AC();
      BGM.master = BGM.ctx.createGain(); BGM.master.gain.value = 0;
      BGM.master.connect(BGM.ctx.destination);
      BGM.noise = bgmNoise(BGM.ctx);
    }
    var p = BGM.ctx.resume();
    if (p && p.catch) p.catch(function () {});
    BGM.next = BGM.ctx.currentTime + 0.08;
    if (!BGM.timer) BGM.timer = setInterval(bgmSchedule, 30);
    bgmFade(BGM.audible ? BGM_VOL : 0, 1.2);
    return true;
  } catch (e) { return false; }
}
function bgmStop() {
  if (!BGM.ctx) return;
  bgmFade(0, 0.4);
  setTimeout(function () { if (!BGM.on) { clearInterval(BGM.timer); BGM.timer = null; BGM.ctx.suspend(); } }, 450);
}
function bgmSave() { try { localStorage.setItem("lara-bgm", BGM.on ? "1" : "0"); } catch (e) {} }
function bgmToggle() {
  BGM.on = !BGM.on;
  if (BGM.on) { if (!bgmStart()) BGM.on = false; } else bgmStop();
  bgmSave();
  var b = document.querySelector(".music-btn");
  if (b) {
    b.setAttribute("aria-pressed", BGM.on);
    b.setAttribute("aria-label", "배경음악 " + (BGM.on ? "끄기" : "켜기"));
    b.innerHTML = svg(BGM.on ? "music" : "musicoff") + '<span class="mlabel">' + (BGM.on ? "음악 끄기" : "음악 켜기") + "</span>";
  }
}
/* HTML 웹앱 실행 중이거나 다른 탭을 볼 때는 잠시 소리를 줄임 */
function bgmAudible(yes) {
  BGM.audible = yes && !document.hidden;
  if (BGM.on && BGM.ctx) bgmFade(BGM.audible ? BGM_VOL : 0, 0.6);
}
document.addEventListener("visibilitychange", function () { bgmAudible(route().view !== "play"); });
/* 예전에 음악을 켜 둔 사람은, 화면을 처음 누를 때 다시 켜짐 */
(function () {
  var want = false;
  try { want = localStorage.getItem("lara-bgm") === "1"; } catch (e) {}
  if (!want) return;
  function first(ev) {
    document.removeEventListener("pointerdown", first, true);
    document.removeEventListener("keydown", first, true);
    if (BGM.on) return;
    if (ev.target && ev.target.closest && ev.target.closest(".music-btn")) return;
    bgmToggle();
  }
  document.addEventListener("pointerdown", first, true);
  document.addEventListener("keydown", first, true);
})();

/* ===== 이벤트 ===== */
var root = document.getElementById("app");
root.addEventListener("click", function (ev) {
  var t;
  if ((t = ev.target.closest("[data-jump]"))) {
    ev.preventDefault();
    var el = document.getElementById(t.getAttribute("data-jump"));
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  if ((t = ev.target.closest("[data-act]"))) {
    var act = t.getAttribute("data-act");
    if (act === "music") { bgmToggle(); return; }
    if (act === "logout") { logout(); return; }
    if (act === "new-app") { ui.editId = null; ui.formKind = null; ui.showForm = true; ui.scrollTo = "app-form"; render(); }
    if (act === "close-form") { ui.editId = null; ui.showForm = false; ui.formKind = null; render(true); }
    if (act === "fullscreen") {
      var box = document.getElementById("player-frame");
      try { box.requestFullscreen().catch(function () { t.textContent = "전체 화면을 쓸 수 없어요"; }); }
      catch (e) { t.textContent = "전체 화면을 쓸 수 없어요"; }
    }
    return;
  }
  if ((t = ev.target.closest("[data-edit]"))) { ui.editId = t.getAttribute("data-edit"); ui.formKind = null; ui.showForm = true; ui.pendingDel = null; ui.scrollTo = "app-form"; render(); return; }
  if ((t = ev.target.closest("[data-del]"))) { onDelete(t.getAttribute("data-del"), t.getAttribute("data-id")); return; }
  if ((t = ev.target.closest("[data-toggle]"))) {
    var a = getApp(t.getAttribute("data-toggle"));
    if (a) { var hid = !a.hidden; quickSave(function () { getApp(a.id).hidden = hid; }, hid ? "학생에게 숨겼어요" : "다시 보이게 했어요"); }
    return;
  }
});
root.addEventListener("input", function (ev) {
  if (ev.target.id === "q") { var r = route(); ui.q[r.cat] = ev.target.value; document.getElementById("grid").innerHTML = gridHtml(r.cat); }
});
root.addEventListener("change", function (ev) {
  if (ev.target.id === "a-cat") {
    var k = ev.target.value; ui.formCat = k;
    document.getElementById("app-form").setAttribute("style", catVars(k));
  }
  if (ev.target.id === "a-file" || ev.target.id === "a-url") setMsg("msg-app", "");
  if (ev.target.name === "a-kind") {
    var html = ev.target.value === "html"; ui.formKind = ev.target.value;
    document.getElementById("kind-link").hidden = html;
    document.getElementById("kind-html").hidden = !html;
  }
});
root.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = ev.target;
  if (f.id === "f-login") login(f);
  else if (f.id === "f-app") saveApp(f);
  else if (f.id === "f-notice") saveNotice(f);
  else if (f.classList.contains("f-mat")) saveMats(f);
});
window.addEventListener("hashchange", function () {
  ui.editId = null; ui.showForm = false; ui.pendingDel = null; ui.formCat = null; ui.formKind = null;
  render();
});

render();

/* 시작: 교사 로그인 상태 확인 + 목록 불러오기 */
(async function () {
  try {
    var r = await fetch("/api/me", { credentials: "same-origin", cache: "no-store" });
    var j = await r.json();
    SETUP = j.setup || null;
    setAdmin(!!j.admin);
  } catch (e) { /* 학생 화면 유지 */ }
  if (route().view !== "play") render(true);
})();
(async function () {
  try {
    var r = await fetch("/api/data", { cache: "no-store" });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.error || ("목록 서버 오류 " + r.status));
    DATA = normalize(j); DATA_STATE = "ready";
  } catch (e) { DATA_STATE = "error"; DATA_ERR = errText(e); }
  render(true);
})();
</script>
